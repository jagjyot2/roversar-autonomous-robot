[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DROVERSAR_FIRMWARE_VERSION=\"1.0.0\"
    -DMOTOR_DRIVER_TB6612FNG=1
    -I include
build_src_filter =
    +<main.cpp>
    +<motor_control/*.cpp>
    +<sensors/*.cpp>
    +<navigation/*.cpp>
    +<safety/*.cpp>
    +<communication/*.cpp>
    +<camera/*.cpp>
